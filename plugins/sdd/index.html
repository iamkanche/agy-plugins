<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Antigravity SDD Workflow Plugin Inspector</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #07070f;
            --card-bg: rgba(255, 255, 255, 0.02);
            --card-border: rgba(255, 255, 255, 0.08);
            --text-primary: #ffffff;
            --text-secondary: #94a3b8;
            --accent-glow: rgba(245, 158, 11, 0.15);
            --border-glow: rgba(245, 158, 11, 0.4);
            --font-main: 'Plus Jakarta Sans', sans-serif;
            --font-title: 'Outfit', sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: var(--font-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background-image: 
                radial-gradient(circle at 80% 20%, rgba(245, 158, 11, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 20% 80%, rgba(239, 68, 68, 0.05) 0%, transparent 50%);
        }

        header {
            padding: 2rem;
            max-width: 1400px;
            width: 100%;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--card-border);
        }

        .back-link {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            transition: color 0.2s ease;
        }

        .back-link:hover {
            color: var(--text-primary);
        }

        .logo {
            font-family: var(--font-title);
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-primary);
        }

        .logo span {
            color: #fbbf24;
        }

        main {
            flex: 1;
            max-width: 1400px;
            width: 100%;
            margin: 0 auto;
            padding: 3rem 2rem;
            display: grid;
            grid-template-columns: 350px minmax(0, 1fr);
            gap: 3rem;
        }

        .glass-panel {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 2rem;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
        }

        .panel-title {
            font-family: var(--font-title);
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            color: var(--text-primary);
        }

        /* Commands Sidebar List */
        .cmd-list {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            max-height: 550px;
            overflow-y: auto;
            padding-right: 0.5rem;
        }

        .cmd-list::-webkit-scrollbar {
            width: 6px;
        }

        .cmd-list::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.01);
        }

        .cmd-list::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
        }

        .cmd-item {
            width: 100%;
            text-align: left;
            padding: 0.85rem 1rem;
            background: transparent;
            border: 1px solid transparent;
            border-radius: 12px;
            color: var(--text-secondary);
            font-family: var(--font-main);
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .cmd-item:hover, .cmd-item.active {
            color: #fbbf24;
            background: rgba(245, 158, 11, 0.06);
            border-color: rgba(245, 158, 11, 0.2);
            padding-left: 1.25rem;
        }

        /* Details Section */
        .details-area {
            display: flex;
            flex-direction: column;
            gap: 2rem;
            min-width: 0;
        }

        .details-header {
            border-bottom: 1px solid var(--card-border);
            padding-bottom: 1.5rem;
        }

        .details-title-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.75rem;
        }

        .details-title {
            font-family: var(--font-title);
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--text-primary);
        }

        .details-badge {
            background: rgba(245, 158, 11, 0.15);
            color: #fbbf24;
            border: 1px solid rgba(245, 158, 11, 0.3);
            font-size: 0.78rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            padding: 0.3rem 0.75rem;
            border-radius: 8px;
        }

        .details-badge.direct {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-secondary);
            border-color: var(--card-border);
        }

        .details-desc {
            color: var(--text-secondary);
            line-height: 1.6;
            font-size: 1.05rem;
        }

        /* Rules and Steps Layout */
        .section-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 2rem;
        }

        .section-title {
            font-family: var(--font-title);
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 1.25rem;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .rule-card {
            background: rgba(255, 255, 255, 0.01);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 1.25rem;
            margin-bottom: 1rem;
            display: flex;
            gap: 1rem;
            align-items: flex-start;
        }

        .rule-status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #fbbf24;
            box-shadow: 0 0 8px #fbbf24;
            margin-top: 0.4rem;
            flex-shrink: 0;
        }

        .rule-status-dot.green {
            background-color: #10b981;
            box-shadow: 0 0 8px #10b981;
        }

        .rule-details {
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
        }

        .rule-name {
            font-weight: 600;
            font-size: 0.95rem;
            color: var(--text-primary);
        }

        .rule-desc {
            font-size: 0.88rem;
            color: var(--text-secondary);
            line-height: 1.4;
        }

        /* Steps Layout */
        .steps-container {
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
        }

        .step-row {
            display: flex;
            gap: 1.25rem;
        }

        .step-num {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: rgba(245, 158, 11, 0.1);
            border: 1px solid rgba(245, 158, 11, 0.2);
            color: #fbbf24;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 0.9rem;
            flex-shrink: 0;
        }

        .step-card {
            flex-grow: 1;
            background: rgba(255, 255, 255, 0.01);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 1.25rem;
        }

        .step-card-title {
            font-weight: 600;
            font-size: 0.95rem;
            color: var(--text-primary);
            margin-bottom: 0.35rem;
        }

        .step-card-desc {
            font-size: 0.88rem;
            color: var(--text-secondary);
            line-height: 1.4;
            margin-bottom: 0.75rem;
        }

        .code-snippet {
            font-family: monospace;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 0.75rem 1rem;
            border-radius: 8px;
            font-size: 0.82rem;
            color: #fbbf24;
            overflow-x: auto;
        }

        .pipeline-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            overflow-x: auto;
            gap: 1rem;
            padding: 0.5rem 0;
        }

        .pipeline-step {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            min-width: 100px;
            position: relative;
            flex: 1;
        }

        .pipeline-step:not(:last-child)::after {
            content: '→';
            position: absolute;
            right: -0.5rem;
            top: 0.85rem;
            color: rgba(245, 158, 11, 0.4);
            font-size: 1.1rem;
        }

        .step-badge {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(245, 158, 11, 0.05);
            border: 1px solid rgba(245, 158, 11, 0.2);
            color: #fbbf24;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 0.85rem;
            margin-bottom: 0.5rem;
            transition: all 0.3s ease;
            box-shadow: 0 0 10px rgba(0,0,0,0.2);
        }

        .pipeline-step:hover .step-badge {
            background: rgba(245, 158, 11, 0.15);
            border-color: rgba(245, 158, 11, 0.5);
            box-shadow: 0 0 15px rgba(245, 158, 11, 0.3);
            transform: scale(1.05);
        }

        .step-label {
            font-size: 0.78rem;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 0.15rem;
        }

        .step-sublabel {
            font-size: 0.65rem;
            color: var(--text-secondary);
            white-space: nowrap;
        }

        .pipeline-group {
            background: rgba(255, 255, 255, 0.01);
            border: 1px solid rgba(255, 255, 255, 0.03);
            border-radius: 16px;
            padding: 1.25rem;
        }

        .group-title {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-secondary);
            font-weight: 700;
            margin-bottom: 1rem;
            border-left: 3px solid #fbbf24;
            padding-left: 0.5rem;
        }

        .step-badge.bootstrap {
            background: rgba(16, 185, 129, 0.05);
            border-color: rgba(16, 185, 129, 0.2);
            color: #10b981;
        }

        .pipeline-step:hover .step-badge.bootstrap {
            background: rgba(16, 185, 129, 0.15);
            border-color: rgba(16, 185, 129, 0.5);
            box-shadow: 0 0 15px rgba(16, 185, 129, 0.3);
        }

        .step-badge.l2 {
            background: rgba(239, 68, 68, 0.05);
            border-color: rgba(239, 68, 68, 0.2);
            color: #ef4444;
        }

        .pipeline-step:hover .step-badge.l2 {
            background: rgba(239, 68, 68, 0.15);
            border-color: rgba(239, 68, 68, 0.5);
            box-shadow: 0 0 15px rgba(239, 68, 68, 0.3);
        }

        @media (max-width: 1024px) {
            main {
                grid-template-columns: 1fr;
            }
            .pipeline-container {
                justify-content: flex-start;
            }
        }

        :root {
            --color-sdd: #fbbf24;
            --color-git: #60a5fa;
            --color-gh-cli: #f43f5e;
            --bg-sdd: rgba(245, 158, 11, 0.05);
            --bg-git: rgba(96, 165, 250, 0.05);
            --bg-gh-cli: rgba(244, 63, 94, 0.05);
            --border-sdd: rgba(245, 158, 11, 0.2);
            --border-git: rgba(96, 165, 250, 0.2);
            --border-gh-cli: rgba(244, 63, 94, 0.2);
        }

        .map-scroll-wrapper {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }

        .map-node {
            cursor: pointer;
            transition: transform 0.2s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.2s ease;
        }

        .map-node rect {
            fill: #0b0c16;
            stroke-width: 1.5px;
            transition: stroke 0.2s, fill 0.2s, stroke-width 0.2s;
        }

        .map-node text {
            font-family: var(--font-main);
            font-size: 11px;
            font-weight: 600;
            fill: var(--text-secondary);
            text-anchor: middle;
            dominant-baseline: middle;
            transition: fill 0.2s;
        }

        /* Colors by plugin */
        .map-node.plugin-sdd rect { stroke: var(--border-sdd); }
        .map-node.plugin-sdd:hover rect { fill: var(--bg-sdd); stroke: var(--color-sdd); }
        .map-node.plugin-git rect { stroke: var(--border-git); }
        .map-node.plugin-git:hover rect { fill: var(--bg-git); stroke: var(--color-git); }
        .map-node.plugin-gh-cli rect { stroke: var(--border-gh-cli); }
        .map-node.plugin-gh-cli:hover rect { fill: var(--bg-gh-cli); stroke: var(--color-gh-cli); }

        /* Dimmed / Highlight states */
        .map-node.dimmed { opacity: 0.15; }
        .map-node.highlighted { opacity: 1.0; }
        .map-node.highlighted text { fill: var(--text-primary); }

        .map-node.active rect { stroke-width: 2.5px; fill: rgba(255, 255, 255, 0.04); }
        .map-node.active.plugin-sdd rect { stroke: var(--color-sdd); filter: drop-shadow(0 0 6px var(--color-sdd)); }
        .map-node.active.plugin-git rect { stroke: var(--color-git); filter: drop-shadow(0 0 6px var(--color-git)); }
        .map-node.active.plugin-gh-cli rect { stroke: var(--color-gh-cli); filter: drop-shadow(0 0 6px var(--color-gh-cli)); }

        .map-edge {
            fill: none;
            stroke-width: 1.5px;
            transition: stroke 0.2s, stroke-width 0.2s, opacity 0.2s;
        }

        .map-edge.type-sequence { stroke: rgba(255, 255, 255, 0.12); }
        .map-edge.type-dependency { stroke: rgba(96, 165, 250, 0.15); stroke-dasharray: 4, 4; }

        .map-edge.dimmed { opacity: 0.05; }
        .map-edge.highlighted {
            opacity: 1.0;
            stroke-width: 2.5px;
            stroke-dasharray: 6, 6;
            animation: flow-dash 25s linear infinite;
        }
        .map-edge.highlighted.from-sdd { stroke: var(--color-sdd); }
        .map-edge.highlighted.from-git { stroke: var(--color-git); }
        .map-edge.highlighted.from-gh-cli { stroke: var(--color-gh-cli); }

        @keyframes flow-dash {
            to { stroke-dashoffset: -1000; }
        }

        /* Accessibility outline */
        .map-node:focus-visible { outline: none; }
        .map-node:focus-visible rect { stroke-width: 2.5px; stroke: #ffffff; filter: drop-shadow(0 0 8px #ffffff); }
    </style>
</head>
<body>
    <header>
        <a href="../../index.html" class="back-link">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
            Back to Registry
        </a>
        <div class="logo">Antigravity Plugins: <span>sdd</span></div>
    </header>

    <main>
        <div class="sidebar">
            <div class="glass-panel">
                <div class="panel-title">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: #fbbf24;"><rect x="3" y="3" width="7" height="9"></rect><rect x="14" y="3" width="7" height="5"></rect><rect x="14" y="12" width="7" height="9"></rect><rect x="3" y="16" width="7" height="5"></rect></svg>
                    SDD Commands
                </div>
                <div class="cmd-list" id="cmd-sidebar-list">
                    <!-- Loaded dynamically -->
                </div>
            </div>
        </div>

        <div class="details-area">
            <div class="glass-panel" style="margin-bottom: 2rem; overflow-x: auto; padding: 1.5rem;">
                <div class="panel-title" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
                    <span style="display: flex; align-items: center; gap: 0.75rem;">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: #fbbf24;"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline></svg>
                        Interactive Skill Connections Map
                    </span>
                    <span id="map-selection-indicator" style="font-size: 0.8rem; color: var(--text-secondary); font-style: italic;">
                        Click a node to lock path selection
                    </span>
                </div>
                <div class="map-scroll-wrapper">
                    <svg id="connection-map-svg" width="1300" height="700" style="background: rgba(0, 0, 0, 0.25); border-radius: 16px; border: 1px solid var(--card-border);">
                        <defs>
                            <marker id="arrow-sdd" viewBox="0 0 10 10" refX="22" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                                <path d="M 0 1 L 10 5 L 0 9 z" fill="#fbbf24" />
                            </marker>
                            <marker id="arrow-git" viewBox="0 0 10 10" refX="22" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                                <path d="M 0 1 L 10 5 L 0 9 z" fill="#60a5fa" />
                            </marker>
                            <marker id="arrow-gh-cli" viewBox="0 0 10 10" refX="22" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                                <path d="M 0 1 L 10 5 L 0 9 z" fill="#f43f5e" />
                            </marker>
                        </defs>
                        <g id="map-edges"></g>
                        <g id="map-nodes"></g>
                    </svg>
                </div>
            </div>

            <div class="glass-panel">
                <div class="details-header" id="details-header-section">
                    <!-- Loaded dynamically -->
                </div>

                <div class="section-grid" style="margin-top: 2rem;">
                    <div>
                        <h4 class="section-title">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: #fbbf24;"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>
                            Active Policies & Rules
                        </h4>
                        <div id="policies-list">
                            <!-- Loaded dynamically -->
                        </div>
                    </div>

                    <div>
                        <h4 class="section-title">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: #fbbf24;"><polyline points="9 11 12 14 22 4"></polyline><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path></svg>
                            Execution Plan
                        </h4>
                        <div class="steps-container" id="steps-list">
                            <!-- Loaded dynamically -->
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        const commandData = {
            "/sdd:steering": {
                gated: false,
                desc: "Analyze the repository structure, stacks, and rules to produce the core guidelines for the development cycle.",
                usage: "/sdd:steering",
                policies: [
                    { enforced: true, name: "Read-only Survey", desc: "Scans manifests, directory structures, and entry points without modifying files." },
                    { enforced: true, name: "Data Extraction", desc: "Formats output directly to terminal or variables without commits." }
                ],
                steps: [
                    { title: "Verify Git Environment", desc: "Ensure execution is within a valid git repository.", code: "git rev-parse --is-inside-work-tree" },
                    { title: "Bootstrap Structure Scan", desc: "Retrieve active files listing and inspect framework manifest types.", code: "git ls-files | head -400" },
                    { title: "Generate Steering Guidelines", desc: "Compile product, tech, structure, and rules specifications based on patterns found." }
                ]
            },
            "/sdd:grill": {
                gated: false,
                desc: "Adversarially analyze a feature request to extract ambiguity, unknown constraints, and generate a ranked list of clarifying questions.",
                usage: "/sdd:grill \"<feature-request-description>\"",
                policies: [
                    { enforced: true, name: "Adversarial Assessment", desc: "Intentionally probes for edge-cases, validation limits, performance risks, and backward compatibility." }
                ],
                steps: [
                    { title: "Parse Request", desc: "Read and analyze the raw backlog feature request details." },
                    { title: "Guideline Comparison", desc: "Cross-reference with steering guidelines to verify stack alignment." },
                    { title: "Rank Clarifications", desc: "Organize output questions ranking blocker items first." }
                ]
            },
            "/sdd:specs": {
                gated: false,
                desc: "Draft functional specifications documenting target changes, data models, non-functional requirements, and acceptance criteria.",
                usage: "/sdd:specs <slug>",
                policies: [
                    { enforced: true, name: "Specification Drafting", desc: "Compiles complete specs file inside the development task folder." }
                ],
                steps: [
                    { title: "Create Feature Folder", desc: "Initializes the feature development folder if not present under `.sdd-docs/development/`." },
                    { title: "Draft Specs Document", desc: "Formats and writes the specifications document." }
                ]
            },
            "/sdd:design": {
                gated: false,
                desc: "Draft system architecture design specifications including component details, class models, API payloads, and sequence layouts.",
                usage: "/sdd:design <slug>",
                policies: [
                    { enforced: true, name: "Design Structure Verification", desc: "Validates architecture components map correctly to guidelines/structure.md." }
                ],
                steps: [
                    { title: "Map Components", desc: "Examine layers and dependencies boundaries." },
                    { title: "Write Design Specs", desc: "Saves design specifications document under the feature directory." }
                ]
            },
            "/sdd:tasks": {
                gated: false,
                desc: "Formulate task checklist lists representing discrete files to edit, create, or delete, and respective validation check commands.",
                usage: "/sdd:tasks <slug>",
                policies: [
                    { enforced: true, name: "Task Separation", desc: "Keeps tasks modular, ordering changes from backend/dependency layers up to frontend." }
                ],
                steps: [
                    { title: "Generate Task List", desc: "Builds structured markdown tasks list." },
                    { title: "Persist task.md", desc: "Saves task checklist to feature development directory." }
                ]
            },
            "/sdd:build": {
                gated: false,
                desc: "Incrementally apply codebase modifications according to the task plan, running compilation/tests periodically.",
                usage: "/sdd:build <slug>",
                policies: [
                    { enforced: false, name: "Incremental Commits", desc: "Commits files incrementally when checkpoints are cleared successfully." }
                ],
                steps: [
                    { title: "Check Task checklist", desc: "Identify active tasks to implement." },
                    { title: "Apply Modifications", desc: "Create or edit target workspace source files." },
                    { title: "Run Tests & Verification", desc: "Trigger local test commands (e.g. phpunit, npm run test) to verify changes." }
                ]
            },
            "/sdd:specs-review": {
                gated: false,
                desc: "Perform automated review on the functional specifications document, validating it against workspace guidelines.",
                usage: "/sdd:specs-review <slug>",
                policies: [
                    { enforced: true, name: "Validation Verdict", desc: "Returns a structured GO/NO-GO verdict listing blocker, major, and nit findings." }
                ],
                steps: [
                    { title: "Audit Specs Document", desc: "Cross-checks contents against rules.md and product.md guidelines." }
                ]
            },

        function calculateBezierPath(fromNode, toNode) {
            const x1 = fromNode.x;
            const y1 = fromNode.y;
            const x2 = toNode.x;
            const y2 = toNode.y;

            // Special loopback check
            if (fromNode.id === "/gh-cli:pr-respond" && toNode.id === "/git:commit") {
                return `M 1220 458 C 1220 510, 1080 510, 1080 458`;
            }

            const dx = x2 - x1;
            const dy = y2 - y1;

            if (Math.abs(dx) >= Math.abs(dy)) {
                // Horizontal flow
                if (dx >= 0) {
                    // Going right
                    return `M ${x1 + 70} ${y1} C ${x1 + 110} ${y1}, ${x2 - 110} ${y2}, ${x2 - 70} ${y2}`;
                } else {
                    // Going left
                    return `M ${x1 - 70} ${y1} C ${x1 - 110} ${y1}, ${x2 + 110} ${y2}, ${x2 + 70} ${y2}`;
                }
            } else {
                // Vertical flow
                if (dy >= 0) {
                    // Going down
                    return `M ${x1} ${y1 + 18} C ${x1} ${y1 + 34}, ${x2} ${y2 - 34}, ${x2} ${y2 - 18}`;
                } else {
                    // Going up
                    return `M ${x1} ${y1 - 18} C ${x1} ${y1 - 34}, ${x2} ${y2 + 34}, ${x2} ${y2 + 18}`;
                }
            }
        }

            updateVisuals() {
                const activeId = this.hoveredNodeId || this.selectedNodeId;

                const connectedNodes = new Set();

                edges.forEach((edge, idx) => {

                        connectedNodes.add(edge.from);

                loadCommandDetails(activeId);

                const indicator = document.getElementById('map-selection-indicator');
                if (lockedId) {
                    if (previewId && previewId !== lockedId) {
                        indicator.innerHTML = `Locked: <strong>${lockedId}</strong> (Previewing: ${previewId})`;
                    } else {
                        indicator.innerHTML = `Selection locked: <strong>${lockedId}</strong>`;
                    }
                } else {
                    indicator.textContent = `Previewing: ${previewId}`;
                }
            }
        };

        function renderMap() {
            const nodesGroup = document.getElementById('map-nodes');
            const edgesGroup = document.getElementById('map-edges');

            nodesGroup.innerHTML = '';
            edgesGroup.innerHTML = '';

            edges.forEach((edge, index) => {
                const fromNode = nodes.find(n => n.id === edge.from);
                const toNode = nodes.find(n => n.id === edge.to);

                if (!fromNode || !toNode) return;

                const pathD = calculateBezierPath(fromNode, toNode);
                const pathEl = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                pathEl.setAttribute('d', pathD);
                pathEl.setAttribute('class', `map-edge type-${edge.type} from-${fromNode.plugin}`);
                pathEl.setAttribute('data-edge-index', index);
                pathEl.setAttribute('marker-end', `url(#arrow-${toNode.plugin})`);

                edgesGroup.appendChild(pathEl);
            });

            nodes.forEach(node => {
                const gEl = document.createElementNS('http://www.w3.org/2000/svg', 'g');
                gEl.setAttribute('class', `map-node plugin-${node.plugin}`);
                gEl.setAttribute('data-node-id', node.id);
                gEl.setAttribute('tabindex', '0');

                const rectEl = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
                rectEl.setAttribute('x', node.x - 70);
                rectEl.setAttribute('y', node.y - 18);
                rectEl.setAttribute('width', 140);
                rectEl.setAttribute('height', 36);
                rectEl.setAttribute('rx', 8);
                gEl.appendChild(rectEl);

                const textEl = document.createElementNS('http://www.w3.org/2000/svg', 'text');
                textEl.setAttribute('x', node.x);
                textEl.setAttribute('y', node.y);
                textEl.textContent = node.name;
                gEl.appendChild(textEl);

                gEl.addEventListener('mouseenter', () => MapState.hover(node.id));
                gEl.addEventListener('mouseleave', () => MapState.hover(null));
                gEl.addEventListener('click', (e) => {
                    e.stopPropagation();
                    MapState.select(node.id);
                });
                gEl.addEventListener('focus', () => MapState.hover(node.id));
                gEl.addEventListener('blur', () => MapState.hover(null));

                gEl.addEventListener('keydown', (e) => {
                    let dirX = 0, dirY = 0;
                    if (e.key === 'ArrowRight') dirX = 1;
                    else if (e.key === 'ArrowLeft') dirX = -1;
                    else if (e.key === 'ArrowDown') dirY = 1;
                    else if (e.key === 'ArrowUp') dirY = -1;
                    else if (e.key === ' ' || e.key === 'Enter') {
                        e.preventDefault();
                        MapState.select(node.id);
                        return;
                    } else {
                        return;
                    }
                    e.preventDefault();

                    let bestNode = null;
                    let minDistance = Infinity;

                    nodes.forEach(n => {
                        if (n.id === node.id) return;
                        const dx = n.x - node.x;
                        const dy = n.y - node.y;

                        if (dirX > 0 && dx <= 10) return;
                        if (dirX < 0 && dx >= -10) return;
                        if (dirY > 0 && dy <= 10) return;
                        if (dirY < 0 && dy >= -10) return;

                        const dist = Math.sqrt(dx * dx + dy * dy);
                        if (dist < minDistance) {
                            minDistance = dist;
                            bestNode = n;
                        }
                    });

                    if (bestNode) {
                        const targetEl = document.querySelector(`[data-node-id="${bestNode.id}"]`);
                        if (targetEl) targetEl.focus();
                    }
                });

                nodesGroup.appendChild(gEl);
            });
        }

        function loadCommandDetails(cmdName) {
            const data = commandData[cmdName];
            if (!data) return;

            headerSection.innerHTML = `
                <div class="details-title-row">
                    <h3 class="details-title">${cmdName}</h3>
                    <span class="details-badge ${data.gated ? '' : 'direct'}">${data.gated ? 'Gated Confirmation' : 'Direct Action'}</span>
                </div>
                <p class="details-desc">${data.desc}</p>
                ${data.usage ? `
                    <div style="margin-top: 1rem;">
                        <span style="font-family: var(--font-title); font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-secondary); display: block; margin-bottom: 0.5rem;">Arguments / Usage Sample</span>
                        <div class="code-snippet" style="font-size: 0.8rem; padding: 0.5rem 0.75rem;">${data.usage}</div>
                    </div>
                ` : ''}
            `;

            policiesList.innerHTML = '';
            data.policies.forEach(policy => {
                const card = document.createElement('div');
                card.className = 'rule-card';
                card.innerHTML = `
                    <div class="rule-status-dot"></div>
                    <div class="rule-details">
                        <span class="rule-name">${policy.name}</span>
                        <span class="rule-desc">${policy.desc}</span>
                    </div>
                `;
                policiesList.appendChild(card);
            });

            stepsList.innerHTML = '';
            data.steps.forEach((step, idx) => {
                const row = document.createElement('div');
                row.className = 'step-row';
                row.innerHTML = `
                    <div class="step-num">${idx + 1}</div>
                    <div class="step-card">
                        <div class="step-card-title">${step.title}</div>
                        <div class="step-card-desc">${step.desc}</div>
                        ${step.code ? `<div class="code-snippet">${step.code}</div>` : ''}
                    </div>
                `;
                stepsList.appendChild(row);
            });
        }

        // Render sidebar items grouped by plugin
        const groups = {
            sdd: { title: "SDD Commands", items: [] },
            git: { title: "Git Commands", items: [] },
            "gh-cli": { title: "GitHub CLI Commands", items: [] }
        };

        Object.keys(commandData).forEach(cmdName => {
            let plugin = "sdd";
            if (cmdName.startsWith("/git:")) plugin = "git";
            else if (cmdName.startsWith("/gh-cli:")) plugin = "gh-cli";
            groups[plugin].items.push(cmdName);
        });

        sidebar.innerHTML = '';

        Object.keys(groups).forEach(pKey => {
            const group = groups[pKey];
            if (group.items.length === 0) return;

            const header = document.createElement('div');
            header.className = 'group-title';
            header.style.marginTop = '1rem';
            header.style.marginBottom = '0.5rem';
            if (pKey === 'git') header.style.borderLeftColor = 'var(--color-git)';
            else if (pKey === 'gh-cli') header.style.borderLeftColor = 'var(--color-gh-cli)';
            header.textContent = group.title;
            sidebar.appendChild(header);

            group.items.forEach(cmdName => {
                const btn = document.createElement('button');
                btn.className = `cmd-item ${cmdName === defaultCmd ? 'active' : ''}`;
                btn.textContent = cmdName;
                btn.addEventListener('click', () => {
                    MapState.select(cmdName);
                });
                sidebar.appendChild(btn);
            });
        });

        // Initialize Map and Load Default
        MapState.init();
        loadCommandDetails(defaultCmd);
    </script>
</body>
</html>
