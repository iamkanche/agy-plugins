openapi: "3.0.3"
info:
  title: Time-tracking API
  version: "0.1.0"
# Consolidated by /sdd:sync-product from per-feature api-diff.md files.
paths:
  /auth/sso/start:
    get:
      summary: Begin OIDC login (redirect to IdP)   # 002_login
      responses:
        "302": { description: Redirect to IdP }
  /auth/sso/callback:
    get:
      summary: OIDC callback — exchange code, issue session   # 002_login
      parameters:
        - { name: code,  in: query, required: true, schema: { type: string } }
        - { name: state, in: query, required: true, schema: { type: string } }
      responses:
        "302": { description: Session issued, redirect to / }
        "400": { description: Invalid or expired state }
