<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Antigravity Git Plugin Inspector</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #07070f;
            --card-bg: rgba(255, 255, 255, 0.02);
            --card-border: rgba(255, 255, 255, 0.08);
            --text-primary: #ffffff;
            --text-secondary: #94a3b8;
            --accent-glow: rgba(59, 130, 246, 0.15);
            --border-glow: rgba(59, 130, 246, 0.4);
            --font-main: 'Plus Jakarta Sans', sans-serif;
            --font-title: 'Outfit', sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: var(--font-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background-image: 
                radial-gradient(circle at 80% 20%, rgba(59, 130, 246, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 20% 80%, rgba(244, 63, 94, 0.05) 0%, transparent 50%);
        }

        header {
            padding: 2rem;
            max-width: 1400px;
            width: 100%;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--card-border);
        }

        .back-link {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            transition: color 0.2s ease;
        }

        .back-link:hover {
            color: var(--text-primary);
        }

        .logo {
            font-family: var(--font-title);
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-primary);
        }

        .logo span {
            color: #60a5fa;
        }

        main {
            flex: 1;
            max-width: 1400px;
            width: 100%;
            margin: 0 auto;
            padding: 3rem 2rem;
            display: grid;
            grid-template-columns: 350px 1fr;
            gap: 3rem;
        }

        .glass-panel {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 2rem;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
        }

        .panel-title {
            font-family: var(--font-title);
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            color: var(--text-primary);
        }

        /* Commands Sidebar List */
        .cmd-list {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            max-height: 550px;
            overflow-y: auto;
            padding-right: 0.5rem;
        }

        .cmd-list::-webkit-scrollbar {
            width: 6px;
        }

        .cmd-list::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.01);
        }

        .cmd-list::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
        }

        .cmd-item {
            width: 100%;
            text-align: left;
            padding: 0.85rem 1rem;
            background: transparent;
            border: 1px solid transparent;
            border-radius: 12px;
            color: var(--text-secondary);
            font-family: var(--font-main);
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .cmd-item:hover, .cmd-item.active {
            color: #60a5fa;
            background: rgba(59, 130, 246, 0.06);
            border-color: rgba(59, 130, 246, 0.2);
        }

        /* Detail Inspector Area */
        .inspector-panel {
            display: flex;
            flex-direction: column;
            gap: 2rem;
        }

        .details-header {
            border-bottom: 1px solid var(--card-border);
            padding-bottom: 1.5rem;
            margin-bottom: 1rem;
        }

        .details-title-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.5rem;
        }

        .details-title {
            font-family: var(--font-title);
            font-size: 2rem;
            font-weight: 700;
            color: #60a5fa;
        }

        .details-badge {
            background: rgba(245, 158, 11, 0.1);
            color: #fbbf24;
            border: 1px solid rgba(245, 158, 11, 0.2);
            padding: 0.3rem 0.8rem;
            border-radius: 50px;
            font-size: 0.78rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .details-badge.direct {
            background: rgba(16, 185, 129, 0.1);
            color: #34d399;
            border-color: rgba(16, 185, 129, 0.2);
        }

        .details-desc {
            color: var(--text-secondary);
            font-size: 1.05rem;
            line-height: 1.6;
        }

        /* Rules Checkbox list */
        .rules-check-list {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 1.25rem;
            margin-top: 1rem;
        }

        .rule-card {
            background: rgba(255, 255, 255, 0.01);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 1.25rem;
            display: flex;
            gap: 1rem;
            align-items: flex-start;
        }

        .rule-status-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background-color: #ef4444;
            box-shadow: 0 0 10px #ef4444;
            flex-shrink: 0;
            margin-top: 0.25rem;
        }

        .rule-status-dot.green {
            background-color: #10b981;
            box-shadow: 0 0 10px #10b981;
        }

        .rule-details {
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
        }

        .rule-name {
            font-size: 0.95rem;
            font-weight: 600;
        }

        .rule-desc {
            font-size: 0.82rem;
            color: var(--text-secondary);
            line-height: 1.4;
        }

        /* Visual steps representation */
        .steps-container {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            margin-top: 1rem;
        }

        .step-row {
            display: flex;
            gap: 1.5rem;
            position: relative;
        }

        .step-row:not(:last-child)::after {
            content: '';
            position: absolute;
            left: 20px;
            top: 40px;
            bottom: -20px;
            width: 2px;
            background: var(--card-border);
        }

        .step-num {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(59, 130, 246, 0.1);
            border: 1px solid rgba(59, 130, 246, 0.3);
            color: #60a5fa;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-family: var(--font-title);
            flex-shrink: 0;
        }

        .step-num.gated-step {
            background: rgba(245, 158, 11, 0.1);
            border-color: rgba(245, 158, 11, 0.3);
            color: #fbbf24;
        }

        .step-card {
            background: rgba(255, 255, 255, 0.01);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 1.25rem;
            flex-grow: 1;
        }

        .step-card-title {
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        .step-card-desc {
            font-size: 0.85rem;
            color: var(--text-secondary);
            line-height: 1.5;
        }

        .code-snippet {
            margin-top: 0.75rem;
            background: #020205;
            padding: 0.75rem 1rem;
            border-radius: 8px;
            font-family: monospace;
            font-size: 0.82rem;
            color: #34d399;
            overflow-x: auto;
            border: 1px solid rgba(255,255,255,0.03);
        }
    </style>
</head>
<body>
    <header>
        <a href="../../index.html" class="back-link">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
            Marketplace Console
        </a>
        <div class="logo">Plugin Inspector: <span>git</span></div>
    </header>

    <main>
        <div class="sidebar">
            <div class="glass-panel">
                <div class="panel-title">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: #60a5fa;"><line x1="4" y1="9" x2="20" y2="9"></line><line x1="4" y1="15" x2="20" y2="15"></line><line x1="10" y1="3" x2="8" y2="21"></line><line x1="16" y1="3" x2="14" y2="21"></line></svg>
                    Commands
                </div>
                <div class="cmd-list" id="cmd-sidebar-list">
                    <!-- Buttons loaded dynamically -->
                </div>
            </div>
        </div>

        <div class="inspector-panel">
            <div class="glass-panel">
                <div class="details-header" id="details-header-section">
                    <!-- Loaded dynamically -->
                </div>

                <div class="panel-title" style="margin-top: 1.5rem;">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: #ef4444;"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>
                    Applicable Security Policies
                </div>
                <div class="rules-check-list" id="policies-list">
                    <!-- Rules loaded dynamically -->
                </div>
            </div>

            <div class="glass-panel">
                <div class="panel-title">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: #34d399;"><polyline points="9 11 12 14 22 4"></polyline><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path></svg>
                    Execution Sequence
                </div>
                <div class="steps-container" id="steps-list">
                    <!-- Steps loaded dynamically -->
                </div>
            </div>
        </div>
    </main>

    <script>
        const commandData = {
            "/git:commit": {
                gated: true,
                desc: "Commit staged modifications using structured conventional commit parameters, scanning for secrets and refusing protected branches. Delegates to the @git-operator subagent.",
                policies: [
                    { enforced: true, name: "git-operator delegation", desc: "Delegates local git execution and history writing to git-operator." },
                    { enforced: true, name: "Never Commit Secrets", desc: "Scan files and diffs for API keys, env values, and configuration secrets before staging." },
                    { enforced: true, name: "Never Commit on Protected Branch", desc: "Blocks execution if checked out on main, master, or develop." },
                    { enforced: true, name: "Gated Human Confirmation", desc: "Prompts the user with the staged changes and composed message before running commit." }
                ],
                steps: [
                    { title: "Inside worktree check", desc: "Verify repository is valid.", code: "git rev-parse --is-inside-work-tree" },
                    { title: "Refuse protected branches", desc: "Checks current branch name against protected names.", code: "case \"$BRANCH\" in main|master|develop) exit 1 ;;" },
                    { title: "Scan for secrets", desc: "Review staged diff content for patterns matching credentials.", code: "# Scan paths and diffs for secrets" },
                    { title: "Verify staged content", desc: "Ensures changes are staged before trying to write commit.", code: "git diff --staged --quiet" },
                    { title: "Confirm layout review (Gate)", desc: "Show prompt to user presenting the complete message." },
                    { title: "Execute commit", desc: "Write to history using multi-line HEREDOC.", code: "git commit -F - <<'EOF'\n...\nEOF" }
                ]
            },
            "/git:pull": {
                gated: true,
                desc: "Pull and integrate changes from origin tracking branches, updating local branch history. Delegates to the @git-operator subagent.",
                policies: [
                    { enforced: true, name: "git-operator delegation", desc: "Delegates local merge, fetch, and rebase actions to git-operator." },
                    { enforced: true, name: "Never force-resolve conflicts", desc: "Aborts rebase/merge if merge conflicts occur, leaving resolution to the engineer." },
                    { enforced: true, name: "Gated History Rewriting", desc: "Requires user gate confirmation if executing rebase pull (--rebase)." }
                ],
                steps: [
                    { title: "Verify clean tree", desc: "Ensure no unstaged modifications override updates.", code: "git status --short" },
                    { title: "Fetch updates", desc: "Retrieve latest remote updates to resolve tracking.", code: "git fetch origin" },
                    { title: "Perform pull integration", desc: "Runs fast-forward merge by default.", code: "git pull --ff-only || git pull" }
                ]
            },
            "/git:rebase": {
                gated: true,
                desc: "Rebase the checked out feature branch onto a target target/remote branch. Delegates to the @git-operator subagent.",
                policies: [
                    { enforced: true, name: "git-operator delegation", desc: "Delegates local fetch, review, and rebase commands to git-operator." },
                    { enforced: true, name: "Gated History Rewriting", desc: "Rebasing local commits rewrites history and requires confirmation." },
                    { enforced: true, name: "Never Rebase Protected Branches", desc: "Rebasing main or develop branch commits is blocked." }
                ],
                steps: [
                    { title: "Verify tree", desc: "Ensure no local uncommitted changes exist.", code: "git status --short" },
                    { title: "Fetch origin", desc: "Ensure remote tracking coordinates are synchronized.", code: "git fetch origin" },
                    { title: "Replay commits (Gate)", desc: "Identify commits to replay and present confirmation to user.", code: "git log --oneline <target>..HEAD" },
                    { title: "Rebase", desc: "Execute rebase command.", code: "git rebase \"$TARGET\"" }
                ]
            },
            "/git:branch-create": {
                gated: false,
                desc: "Create and switch to a new branch, fetching remote tracking updates beforehand. Delegates to the @git-operator subagent.",
                policies: [
                    { enforced: true, name: "git-operator delegation", desc: "Delegates all local branch checkouts and switch setups to git-operator." },
                    { enforced: true, name: "Never branch off stale default", desc: "Fetches from remote to switch from latest default commit." }
                ],
                steps: [
                    { title: "Inside worktree check", desc: "Verify repository is valid.", code: "git rev-parse --is-inside-work-tree" },
                    { title: "Resolve default branch", desc: "Find target default remote branch.", code: "git remote show origin" },
                    { title: "Fetch remote defaults", desc: "Download latest origin pointers.", code: "git fetch origin \"$DEFAULT\"" },
                    { title: "Switch to branch", desc: "Create and switched checkout.", code: "git switch -c \"$NAME\" \"origin/$DEFAULT\"" }
                ]
            },
            "/git:branch-delete": {
                gated: true,
                desc: "Delete a branch locally and/or on origin remote, refusing protected targets. Delegates to the @git-operator subagent.",
                policies: [
                    { enforced: true, name: "git-operator delegation", desc: "Delegates local and remote branch removals to git-operator." },
                    { enforced: true, name: "Never delete protected branch", desc: "Blocks operations if targeting main, master or develop." },
                    { enforced: true, name: "Confirm side effects", desc: "Destructive deletes require human gating check." }
                ],
                steps: [
                    { title: "Verify name matches", desc: "Refuse delete if targeting main, master, or develop." },
                    { title: "Check checked-out status", desc: "Ensures you are switch off the branch before delete.", code: "if [ \"$CURRENT\" = \"$TARGET\" ]; then exit 1; fi" },
                    { title: "Delete locally", desc: "Safe delete by default.", code: "git branch -d \"$TARGET\"" },
                    { title: "Delete remote origin", desc: "Pushes deletion using git syntax.", code: "git push origin --delete \"$TARGET\"" }
                ]
            },
            "/git:tag-create": {
                gated: true,
                desc: "Create an annotated tag at HEAD and push it to origin remote. Delegates to the @git-operator subagent.",
                policies: [
                    { enforced: true, name: "git-operator tag creation", desc: "Delegates local tag creation and origin push to git-operator." }
                ],
                steps: [
                    { title: "Inside worktree check", desc: "Verify repository.", code: "git rev-parse --is-inside-work-tree" },
                    { title: "Check existing tags", desc: "Verify tag doesn't exist.", code: "git rev-parse -q --verify \"refs/tags/$TAG\"" },
                    { title: "Confirm tag push (Gate)", desc: "Ask user permission to write tag." },
                    { title: "Create and push tag", desc: "Write tag annotations.", code: "git tag -a \"$TAG\" -m \"$MSG\" && git push origin \"$TAG\"" }
                ]
            },
            "/git:tag-delete": {
                gated: true,
                desc: "Delete a local and/or remote tag securely. Delegates to the @git-operator subagent.",
                policies: [
                    { enforced: true, name: "git-operator tag deletion", desc: "Delegates local tag deletion and origin remote push to git-operator." },
                    { enforced: true, name: "Gated Human Confirmation", desc: "Destructive tag deletions require human confirmation gate." }
                ],
                steps: [
                    { title: "Verify repository", desc: "Ensure command runs inside a Git repository.", code: "git rev-parse --is-inside-work-tree" },
                    { title: "Check local & remote existence", desc: "Check if target tag exists locally or on remote.", code: "git rev-parse --verify \"refs/tags/$TAG\"" },
                    { title: "Confirm delete (Gate)", desc: "Gate execution until user confirms deletion." },
                    { title: "Delete locally", desc: "Delete tag locally.", code: "git tag -d \"$TAG\"" },
                    { title: "Delete remotely", desc: "Delete remote tag if --remote requested.", code: "git push origin --delete \"$TAG\"" }
                ]
            },
            "/git:tag-push": {
                gated: true,
                desc: "Push local tags to the remote origin. Delegates to the @git-operator subagent.",
                policies: [
                    { enforced: true, name: "git-operator tag pushing", desc: "Delegates remote tag push operations to git-operator." },
                    { enforced: true, name: "Confirm tag push (Gate)", desc: "Gated behind explicit confirmation." }
                ],
                steps: [
                    { title: "Verify repository", desc: "Ensure command runs inside a Git repository.", code: "git rev-parse --is-inside-work-tree" },
                    { title: "Check tag existence", desc: "Verify local tag exists before pushing.", code: "git rev-parse --verify \"refs/tags/$TAG\"" },
                    { title: "Confirm push (Gate)", desc: "Gate execution until user confirms push." },
                    { title: "Push tag", desc: "Push tags to remote origin.", code: "git push origin \"$TAG\"" }
                ]
            },
            "/git:switch": {
                gated: false,
                desc: "Switch working tree checkout to target branch, fetching remote tracking automatically. Delegates to the @git-operator subagent.",
                policies: [
                    { enforced: true, name: "git-operator delegation", desc: "Delegates branch tracking checks and checkout switch to git-operator." },
                    { enforced: false, name: "Direct checkout switch", desc: "Non-destructive switch which doesn't rewrite repository history." }
                ],
                steps: [
                    { title: "Fetch origin coordinates", desc: "Get latest branch references.", code: "git fetch origin" },
                    { title: "Switch or switch-track", desc: "Checkout target local branch or set up tracking for origin branch.", code: "git switch --track \"origin/$TARGET\"" }
                ]
            }
        };

        const sidebar = document.getElementById('cmd-sidebar-list');
        const headerSection = document.getElementById('details-header-section');
        const policiesList = document.getElementById('policies-list');
        const stepsList = document.getElementById('steps-list');

        function loadCommandDetails(cmdName) {
            const data = commandData[cmdName] || {
                gated: false,
                desc: "Git workflow command.",
                policies: [{ enforced: true, name: "Gated Side-Effects", desc: "Gated behind confirmation." }],
                steps: [{ title: "Run git command", desc: "Executes operation." }]
            };

            // Header section
            headerSection.innerHTML = `
                <div class="details-title-row">
                    <h3 class="details-title">${cmdName}</h3>
                    <span class="details-badge ${data.gated ? '' : 'direct'}">${data.gated ? 'Gated Confirmation' : 'Direct Action'}</span>
                </div>
                <p class="details-desc">${data.desc}</p>
            `;

            // Policies list
            policiesList.innerHTML = '';
            data.policies.forEach(policy => {
                const card = document.createElement('div');
                card.className = 'rule-card';
                card.innerHTML = `
                    <div class="rule-status-dot ${policy.enforced ? '' : 'green'}"></div>
                    <div class="rule-details">
                        <span class="rule-name">${policy.name}</span>
                        <span class="rule-desc">${policy.desc}</span>
                    </div>
                `;
                policiesList.appendChild(card);
            });

            // Steps list
            stepsList.innerHTML = '';
            data.steps.forEach((step, idx) => {
                const row = document.createElement('div');
                row.className = 'step-row';
                row.innerHTML = `
                    <div class="step-num">${idx + 1}</div>
                    <div class="step-card">
                        <div class="step-card-title">${step.title}</div>
                        <div class="step-card-desc">${step.desc}</div>
                        ${step.code ? `<div class="code-snippet">${step.code}</div>` : ''}
                    </div>
                `;
                stepsList.appendChild(row);
            });
        }

        // Render sidebar items
        const defaultCmd = Object.keys(commandData)[0];
        Object.keys(commandData).forEach(cmdName => {
            const btn = document.createElement('button');
            btn.className = `cmd-item ${cmdName === defaultCmd ? 'active' : ''}`;
            btn.textContent = cmdName;
            btn.addEventListener('click', () => {
                document.querySelectorAll('.cmd-item').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                loadCommandDetails(cmdName);
            });
            sidebar.appendChild(btn);
        });

        // Load default
        loadCommandDetails(defaultCmd);
    </script>
</body>
</html>
