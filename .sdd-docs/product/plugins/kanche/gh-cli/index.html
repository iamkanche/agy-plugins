<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Antigravity GitHub CLI Plugin Inspector</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #07070f;
            --card-bg: rgba(255, 255, 255, 0.02);
            --card-border: rgba(255, 255, 255, 0.08);
            --text-primary: #ffffff;
            --text-secondary: #94a3b8;
            --accent-glow: rgba(59, 130, 246, 0.15);
            --border-glow: rgba(59, 130, 246, 0.4);
            --font-main: 'Plus Jakarta Sans', sans-serif;
            --font-title: 'Outfit', sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: var(--font-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background-image: 
                radial-gradient(circle at 80% 20%, rgba(139, 92, 246, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 20% 80%, rgba(236, 72, 153, 0.05) 0%, transparent 50%);
        }

        header {
            padding: 2rem;
            max-width: 1400px;
            width: 100%;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--card-border);
        }

        .back-link {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            transition: color 0.2s ease;
        }

        .back-link:hover {
            color: var(--text-primary);
        }

        .logo {
            font-family: var(--font-title);
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-primary);
        }

        .logo span {
            color: #a78bfa;
        }

        main {
            flex: 1;
            max-width: 1400px;
            width: 100%;
            margin: 0 auto;
            padding: 3rem 2rem;
            display: grid;
            grid-template-columns: 350px 1fr;
            gap: 3rem;
        }

        .glass-panel {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 2rem;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
        }

        .panel-title {
            font-family: var(--font-title);
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            color: var(--text-primary);
        }

        /* Commands Sidebar List */
        .cmd-list {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            max-height: 550px;
            overflow-y: auto;
            padding-right: 0.5rem;
        }

        .cmd-list::-webkit-scrollbar {
            width: 6px;
        }

        .cmd-list::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.01);
        }

        .cmd-list::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
        }

        .cmd-item {
            width: 100%;
            text-align: left;
            padding: 0.85rem 1rem;
            background: transparent;
            border: 1px solid transparent;
            border-radius: 12px;
            color: var(--text-secondary);
            font-family: var(--font-main);
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .cmd-item:hover, .cmd-item.active {
            color: #a78bfa;
            background: rgba(139, 92, 246, 0.06);
            border-color: rgba(139, 92, 246, 0.2);
        }

        /* Detail Inspector Area */
        .inspector-panel {
            display: flex;
            flex-direction: column;
            gap: 2rem;
        }

        .details-header {
            border-bottom: 1px solid var(--card-border);
            padding-bottom: 1.5rem;
            margin-bottom: 1rem;
        }

        .details-title-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.5rem;
        }

        .details-title {
            font-family: var(--font-title);
            font-size: 2rem;
            font-weight: 700;
            color: #a78bfa;
        }

        .details-badge {
            background: rgba(245, 158, 11, 0.1);
            color: #fbbf24;
            border: 1px solid rgba(245, 158, 11, 0.2);
            padding: 0.3rem 0.8rem;
            border-radius: 50px;
            font-size: 0.78rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .details-badge.direct {
            background: rgba(16, 185, 129, 0.1);
            color: #34d399;
            border-color: rgba(16, 185, 129, 0.2);
        }

        .details-desc {
            color: var(--text-secondary);
            font-size: 1.05rem;
            line-height: 1.6;
        }

        /* Rules Checkbox list */
        .rules-check-list {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 1.25rem;
            margin-top: 1rem;
        }

        .rule-card {
            background: rgba(255, 255, 255, 0.01);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 1.25rem;
            display: flex;
            gap: 1rem;
            align-items: flex-start;
        }

        .rule-status-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background-color: #ef4444;
            box-shadow: 0 0 10px #ef4444;
            flex-shrink: 0;
            margin-top: 0.25rem;
        }

        .rule-status-dot.green {
            background-color: #10b981;
            box-shadow: 0 0 10px #10b981;
        }

        .rule-details {
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
        }

        .rule-name {
            font-size: 0.95rem;
            font-weight: 600;
        }

        .rule-desc {
            font-size: 0.82rem;
            color: var(--text-secondary);
            line-height: 1.4;
        }

        /* Visual steps representation */
        .steps-container {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            margin-top: 1rem;
        }

        .step-row {
            display: flex;
            gap: 1.5rem;
            position: relative;
        }

        .step-row:not(:last-child)::after {
            content: '';
            position: absolute;
            left: 20px;
            top: 40px;
            bottom: -20px;
            width: 2px;
            background: var(--card-border);
        }

        .step-num {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(139, 92, 246, 0.1);
            border: 1px solid rgba(139, 92, 246, 0.3);
            color: #a78bfa;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-family: var(--font-title);
            flex-shrink: 0;
        }

        .step-num.gated-step {
            background: rgba(245, 158, 11, 0.1);
            border-color: rgba(245, 158, 11, 0.3);
            color: #fbbf24;
        }

        .step-card {
            background: rgba(255, 255, 255, 0.01);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 1.25rem;
            flex-grow: 1;
        }

        .step-card-title {
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        .step-card-desc {
            font-size: 0.85rem;
            color: var(--text-secondary);
            line-height: 1.5;
        }

        .code-snippet {
            margin-top: 0.75rem;
            background: #020205;
            padding: 0.75rem 1rem;
            border-radius: 8px;
            font-family: monospace;
            font-size: 0.82rem;
            color: #34d399;
            overflow-x: auto;
            border: 1px solid rgba(255,255,255,0.03);
        }
    </style>
</head>
<body>
    <header>
        <a href="../../index.html" class="back-link">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
            Marketplace Console
        </a>
        <div class="logo">Plugin Inspector: <span>gh-cli</span></div>
    </header>

    <main>
        <div class="sidebar">
            <div class="glass-panel">
                <div class="panel-title">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: #a78bfa;"><line x1="4" y1="9" x2="20" y2="9"></line><line x1="4" y1="15" x2="20" y2="15"></line><line x1="10" y1="3" x2="8" y2="21"></line><line x1="16" y1="3" x2="14" y2="21"></line></svg>
                    Commands
                </div>
                <div class="cmd-list" id="cmd-sidebar-list">
                    <!-- Buttons loaded dynamically -->
                </div>
            </div>
        </div>

        <div class="inspector-panel">
            <div class="glass-panel">
                <div class="details-header" id="details-header-section">
                    <!-- Loaded dynamically -->
                </div>

                <div class="panel-title" style="margin-top: 1.5rem;">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: #ef4444;"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>
                    Applicable Security Policies
                </div>
                <div class="rules-check-list" id="policies-list">
                    <!-- Rules loaded dynamically -->
                </div>
            </div>

            <div class="glass-panel">
                <div class="panel-title">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: #34d399;"><polyline points="9 11 12 14 22 4"></polyline><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path></svg>
                    Execution Sequence
                </div>
                <div class="steps-container" id="steps-list">
                    <!-- Steps loaded dynamically -->
                </div>
            </div>
        </div>
    </main>

    <script>
        const commandData = {
            "/gh-cli:pr-create": {
                gated: true,
                desc: "Open a pull request for the current branch against the default (or given) base, with auto-assignee support. Delegates to the @gh-operator subagent.",
                policies: [
                    { enforced: true, name: "gh-operator delegation", desc: "Delegates remote pull request creations and pushes to gh-operator." },
                    { enforced: true, name: "Gated Human Confirmation", desc: "Show complete draft title and body to user before submitting." },
                    { enforced: true, name: "Never Push Force", desc: "Pushes feature branch normally without force coordinates." }
                ],
                steps: [
                    { title: "Verify gh auth", desc: "Check authentication state.", code: "gh auth status" },
                    { title: "Push feature branch", desc: "Push local commits setting upstream target.", code: "git push -u origin \"$BRANCH\"" },
                    { title: "Compose PR body", desc: "Generate technical changes summary from log." },
                    { title: "User confirmation (Gate)", desc: "Gate creation until review approval." },
                    { title: "Create pull request", desc: "Invoke gh cli builder with auto-assignee.", code: "gh pr create --title \"$TITLE\" --body \"$BODY\" --assignee \"@me\"" }
                ]
            },
            "/gh-cli:pr-list": {
                gated: false,
                desc: "List the repository's pull requests and resolve current branch PR state. Delegates to the @gh-operator subagent.",
                policies: [
                    { enforced: true, name: "gh-operator delegation", desc: "Queries listing metadata using gh-operator subagent." },
                    { enforced: false, name: "Read-only lookup", desc: "No modifications are written to branch history." }
                ],
                steps: [
                    { title: "Verify gh auth", desc: "Check authentication.", code: "gh auth status" },
                    { title: "Query pull requests", desc: "List open PR details in tabular shape.", code: "gh pr list --state open --limit 10" },
                    { title: "Check current branch", desc: "Resolve if branch has associated open PR.", code: "gh pr view \"$BRANCH\" --json number,title,state,url" }
                ]
            },
            "/gh-cli:pr-review": {
                gated: true,
                desc: "Review a pull request and post a formatted summary with inline suggestions via GitHub API. Delegates to the @gh-operator subagent.",
                policies: [
                    { enforced: true, name: "gh-operator delegation", desc: "Delegates all remote GitHub query and review operations to gh-operator." },
                    { enforced: true, name: "Audit against AGENTS.md rules", desc: "Verifies pull request diff compliance against local and global AGENTS.md guidelines." },
                    { enforced: true, name: "Formatted Suggestion Blocks", desc: "Enforces a structured [SEVERITY] Suggestion format for reviews." }
                ],
                steps: [
                    { title: "Require gh auth", desc: "Verify gh authentication.", code: "gh auth status" },
                    { title: "Fetch PR diff", desc: "Download PR metadata and diff lines.", code: "gh pr diff $PR" },
                    { title: "Audit against AGENTS.md", desc: "Audit modifications against guidelines in AGENTS.md." },
                    { title: "Classify findings", desc: "Tag comments exactly as [HIGH]/[MEDIUM]/[LOW] with line suggestions." },
                    { title: "Post review comments (Gate)", desc: "Gate review submission to the user, then post in a single call.", code: "gh api --method POST \"repos/{owner}/{repo}/pulls/${PR}/reviews\" ..." }
                ]
            },
            "/gh-cli:pr-approve": {
                gated: true,
                desc: "Approve a GitHub pull request, preventing self-approval review actions. Delegates to the @gh-operator subagent.",
                policies: [
                    { enforced: true, name: "gh-operator delegation", desc: "Delegates authentication and approval reviews submission to gh-operator." },
                    { enforced: true, name: "Never Approve Own PR", desc: "Detects the PR author and blocks approval if matching user." },
                    { enforced: true, name: "Review Gated Check", desc: "Confirms PR title and details before submitting approval review." }
                ],
                steps: [
                    { title: "Verify gh auth", desc: "Ensures gh CLI tool is authenticated.", code: "gh auth status" },
                    { title: "Fetch PR details", desc: "Get author metadata.", code: "gh pr view $PR --json author" },
                    { title: "Self-approval gate check", desc: "Block if author matches current user.", code: "if [ \"$GH_USER\" = \"$PR_AUTHOR\" ]; then exit 1; fi" },
                    { title: "Execute approval (Gate)", desc: "Prompts user and submits approval.", code: "gh pr review $PR --approve" }
                ]
            },
            "/gh-cli:pr-respond": {
                gated: true,
                desc: "Triage thread feedback, commit code fixes, and reply to reviews. Delegates to @gh-operator and @git-operator.",
                policies: [
                    { enforced: true, name: "gh-operator thread replies", desc: "Delegates fetching comments and posting responses to gh-operator." },
                    { enforced: true, name: "git-operator fix committing", desc: "Delegates staging, Conventional Commits, and push to git-operator." },
                    { enforced: true, name: "Double review gates", desc: "Gated at code change planning and review replies posting." }
                ],
                steps: [
                    { title: "Fetch comments", desc: "Retrieve active threads.", code: "gh api \"repos/{owner}/{repo}/pulls/${PR}/comments\"" },
                    { title: "Plan fixes (Gate)", desc: "Draft code modifications and reply texts." },
                    { title: "Apply fixes", desc: "Perform local modifications and run verifications." },
                    { title: "Stage and Push", desc: "Commit Conventional-style feedback address.", code: "git add . && git commit -m \"fix(pr): feedback\" && git push origin \"$BRANCH\"" },
                    { title: "Reply confirmation (Gate)", desc: "Present final replies block to user." },
                    { title: "Submit replies", desc: "Post thread responses to GitHub API.", code: "gh api --method POST \"repos/{owner}/{repo}/pulls/comments/$ID/replies\" -f body=\"$REPLY\"" }
                ]
            },
            "/gh-cli:pr-merge": {
                gated: true,
                desc: "Merge a pull request on GitHub, with deleting the branch enabled by default. Delegates to the @gh-operator subagent.",
                policies: [
                    { enforced: true, name: "gh-operator delegation", desc: "Delegates remote pull request merging and checks to gh-operator." },
                    { enforced: true, name: "Gated Human Confirmation", desc: "Confirm PR details and merge method before executing." },
                    { enforced: true, name: "Branch Deletion Default", desc: "Deletes local and remote feature branch after merge unless requested otherwise." }
                ],
                steps: [
                    { title: "Verify gh auth", desc: "Check authentication state.", code: "gh auth status" },
                    { title: "Fetch PR details", desc: "Get PR coordinates and branch names.", code: "gh pr view $PR --json headRefName,baseRefName" },
                    { title: "User confirmation (Gate)", desc: "Gate execution until merge confirmation." },
                    { title: "Execute merge", desc: "Invoke gh cli merge with branch deletion.", code: "gh pr merge $PR --merge --delete-branch" },
                    { title: "Local cleanup", desc: "Switch to base branch and delete local merged branch.", code: "git checkout $BASE && git branch -d $HEAD" }
                ]
            }
        };

        const sidebar = document.getElementById('cmd-sidebar-list');
        const headerSection = document.getElementById('details-header-section');
        const policiesList = document.getElementById('policies-list');
        const stepsList = document.getElementById('steps-list');

        function loadCommandDetails(cmdName) {
            const data = commandData[cmdName] || {
                gated: false,
                desc: "GitHub CLI command.",
                policies: [{ enforced: true, name: "Gated Side-Effects", desc: "Gated behind confirmation." }],
                steps: [{ title: "Run gh command", desc: "Executes operation." }]
            };

            // Header section
            headerSection.innerHTML = `
                <div class="details-title-row">
                    <h3 class="details-title">${cmdName}</h3>
                    <span class="details-badge ${data.gated ? '' : 'direct'}">${data.gated ? 'Gated Confirmation' : 'Direct Action'}</span>
                </div>
                <p class="details-desc">${data.desc}</p>
            `;

            // Policies list
            policiesList.innerHTML = '';
            data.policies.forEach(policy => {
                const card = document.createElement('div');
                card.className = 'rule-card';
                card.innerHTML = `
                    <div class="rule-status-dot ${policy.enforced ? '' : 'green'}"></div>
                    <div class="rule-details">
                        <span class="rule-name">${policy.name}</span>
                        <span class="rule-desc">${policy.desc}</span>
                    </div>
                `;
                policiesList.appendChild(card);
            });

            // Steps list
            stepsList.innerHTML = '';
            data.steps.forEach((step, idx) => {
                const row = document.createElement('div');
                row.className = 'step-row';
                row.innerHTML = `
                    <div class="step-num">${idx + 1}</div>
                    <div class="step-card">
                        <div class="step-card-title">${step.title}</div>
                        <div class="step-card-desc">${step.desc}</div>
                        ${step.code ? `<div class="code-snippet">${step.code}</div>` : ''}
                    </div>
                `;
                stepsList.appendChild(row);
            });
        }

        // Render sidebar items
        const defaultCmd = Object.keys(commandData)[0];
        Object.keys(commandData).forEach(cmdName => {
            const btn = document.createElement('button');
            btn.className = `cmd-item ${cmdName === defaultCmd ? 'active' : ''}`;
            btn.textContent = cmdName;
            btn.addEventListener('click', () => {
                document.querySelectorAll('.cmd-item').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                loadCommandDetails(cmdName);
            });
            sidebar.appendChild(btn);
        });

        // Load default
        loadCommandDetails(defaultCmd);
    </script>
</body>
</html>
