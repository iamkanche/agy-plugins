<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Antigravity Plugins Registry - Kanche Developer Suite</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@500;600;700;800&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-gradient: radial-gradient(circle at 50% -20%, #1e1b4b 0%, #0f172a 45%, #020617 100%);
            --glass-bg: rgba(15, 23, 42, 0.65);
            --glass-border: rgba(255, 255, 255, 0.08);
            --card-bg: rgba(30, 41, 59, 0.5);
            --card-border: rgba(255, 255, 255, 0.05);
            --accent-blue: #3b82f6;
            --accent-cyan: #06b6d4;
            --accent-purple: #8b5cf6;
            --accent-amber: #f59e0b;
            --accent-pink: #ec4899;
            --accent-emerald: #10b981;
            --accent-indigo: #6366f1;
            --accent-teal: #14b8a6;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --font-main: "Inter", sans-serif;
            --font-title: "Outfit", sans-serif;
            --font-code: "Fira Code", monospace;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--bg-gradient);
            background-attachment: fixed;
            color: var(--text-primary);
            font-family: var(--font-main);
            min-height: 100vh;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            gap: 2rem;
        }

        /* Header */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 2rem;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            backdrop-filter: blur(12px);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            font-family: var(--font-title);
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-primary);
        }

        .logo-dot {
            width: 12px;
            height: 12px;
            background: var(--accent-blue);
            border-radius: 50%;
            box-shadow: 0 0 12px var(--accent-blue);
        }

        .marketplace-badge {
            font-family: var(--font-code);
            font-size: 0.8rem;
            background: rgba(59, 130, 246, 0.1);
            color: #60a5fa;
            border: 1px solid rgba(59, 130, 246, 0.2);
            padding: 0.35rem 0.75rem;
            border-radius: 50px;
            letter-spacing: 1px;
        }

        /* Layout */
        main {
            display: grid;
            grid-template-columns: 320px 1fr;
            gap: 2rem;
            flex-grow: 1;
        }

        /* Sidebar */
        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .glass-panel {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 1.5rem;
            backdrop-filter: blur(12px);
        }

        .panel-title {
            font-family: var(--font-title);
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .meta-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .meta-item {
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
        }

        .meta-label {
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        .meta-val {
            font-size: 0.95rem;
            font-weight: 500;
            color: var(--text-primary);
        }

        /* Plugin Navigation List */
        .plugin-nav-list {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .plugin-nav-btn {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid transparent;
            color: var(--text-secondary);
            padding: 0.85rem 1rem;
            border-radius: 14px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-family: var(--font-main);
            font-size: 0.95rem;
            font-weight: 500;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            text-align: left;
        }

        .plugin-nav-btn:hover {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-primary);
        }

        .plugin-nav-btn.active {
            background: rgba(59, 130, 246, 0.1);
            border-color: rgba(59, 130, 246, 0.3);
            color: #60a5fa;
            box-shadow: 0 4px 20px rgba(59, 130, 246, 0.1);
        }

        .plugin-nav-btn.cyan-theme.active {
            background: rgba(6, 182, 212, 0.1);
            border-color: rgba(6, 182, 212, 0.3);
            color: #22d3ee;
            box-shadow: 0 4px 20px rgba(6, 182, 212, 0.1);
        }

        .plugin-nav-btn.purple-theme.active {
            background: rgba(139, 92, 246, 0.1);
            border-color: rgba(139, 92, 246, 0.3);
            color: #c084fc;
            box-shadow: 0 4px 20px rgba(139, 92, 246, 0.1);
        }

        .plugin-nav-btn.amber-theme.active {
            background: rgba(245, 158, 11, 0.1);
            border-color: rgba(245, 158, 11, 0.3);
            color: #fbbf24;
            box-shadow: 0 4px 20px rgba(245, 158, 11, 0.1);
        }

        .plugin-nav-btn.pink-theme.active {
            background: rgba(236, 72, 153, 0.1);
            border-color: rgba(236, 72, 153, 0.3);
            color: #f472b6;
            box-shadow: 0 4px 20px rgba(236, 72, 153, 0.1);
        }

        .plugin-nav-btn.emerald-theme.active {
            background: rgba(16, 185, 129, 0.1);
            border-color: rgba(16, 185, 129, 0.3);
            color: #34d399;
            box-shadow: 0 4px 20px rgba(16, 185, 129, 0.1);
        }

        .plugin-nav-btn.indigo-theme.active {
            background: rgba(99, 102, 241, 0.1);
            border-color: rgba(99, 102, 241, 0.3);
            color: #818cf8;
            box-shadow: 0 4px 20px rgba(99, 102, 241, 0.1);
        }

        .plugin-nav-btn.teal-theme.active {
            background: rgba(20, 184, 166, 0.1);
            border-color: rgba(20, 184, 166, 0.3);
            color: #2dd4bf;
            box-shadow: 0 4px 20px rgba(20, 184, 166, 0.1);
        }

        .plugin-nav-btn .badge {
            font-size: 0.75rem;
            background: rgba(255, 255, 255, 0.05);
            padding: 0.2rem 0.6rem;
            border-radius: 50px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* Content Area */
        .content-area {
            display: flex;
            flex-direction: column;
            gap: 2rem;
            min-width: 0;
        }

        .search-bar-container {
            position: relative;
            width: 100%;
        }

        .search-input {
            width: 100%;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 18px;
            padding: 1.2rem 1.5rem 1.2rem 3rem;
            color: var(--text-primary);
            font-family: var(--font-main);
            font-size: 1rem;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .search-input:focus {
            outline: none;
            border-color: rgba(59, 130, 246, 0.5);
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.15);
            background: rgba(255, 255, 255, 0.05);
        }

        .search-icon {
            position: absolute;
            left: 1.2rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-secondary);
            pointer-events: none;
            width: 18px;
            height: 18px;
        }

        /* Commands Section */
        .plugin-header {
            margin-bottom: 1.5rem;
            border-bottom: 1px solid var(--card-border);
            padding-bottom: 1.5rem;
        }

        .plugin-title-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.5rem;
        }

        .plugin-title {
            font-family: var(--font-title);
            font-size: 2.2rem;
            font-weight: 700;
            color: var(--text-primary);
        }

        .plugin-title span { color: #60a5fa; }
        .plugin-title.cyan span { color: #22d3ee; }
        .plugin-title.purple span { color: #a78bfa; }
        .plugin-title.amber span { color: #fbbf24; }
        .plugin-title.pink span { color: #f472b6; }
        .plugin-title.emerald span { color: #34d399; }
        .plugin-title.indigo span { color: #818cf8; }
        .plugin-title.teal span { color: #2dd4bf; }

        .plugin-meta {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .plugin-version {
            font-size: 0.9rem;
            color: var(--text-secondary);
            font-weight: 500;
        }

        .inspect-plugin-btn {
            background: rgba(255,255,255,0.02);
            border: 1px solid var(--card-border);
            color: var(--text-primary);
            padding: 0.4rem 1rem;
            border-radius: 10px;
            font-size: 0.85rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            transition: all 0.2s ease;
        }

        .inspect-plugin-btn:hover {
            background: rgba(255,255,255,0.06);
            border-color: rgba(255,255,255,0.2);
        }

        .plugin-desc {
            color: var(--text-secondary);
            line-height: 1.6;
            font-size: 1.05rem;
        }

        .commands-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.5rem;
        }

        .command-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 1.5rem;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 180px;
        }

        .command-card::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.05) 0%, rgba(59, 130, 246, 0.01) 100%);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .command-card.cyan-card::before { background: linear-gradient(135deg, rgba(6, 182, 212, 0.05) 0%, rgba(6, 182, 212, 0.01) 100%); }
        .command-card.purple-card::before { background: linear-gradient(135deg, rgba(139, 92, 246, 0.05) 0%, rgba(139, 92, 246, 0.01) 100%); }
        .command-card.amber-card::before { background: linear-gradient(135deg, rgba(245, 158, 11, 0.05) 0%, rgba(245, 158, 11, 0.01) 100%); }
        .command-card.pink-card::before { background: linear-gradient(135deg, rgba(236, 72, 153, 0.05) 0%, rgba(236, 72, 153, 0.01) 100%); }
        .command-card.emerald-card::before { background: linear-gradient(135deg, rgba(16, 185, 129, 0.05) 0%, rgba(16, 185, 129, 0.01) 100%); }
        .command-card.indigo-card::before { background: linear-gradient(135deg, rgba(99, 102, 241, 0.05) 0%, rgba(99, 102, 241, 0.01) 100%); }
        .command-card.teal-card::before { background: linear-gradient(135deg, rgba(20, 184, 166, 0.05) 0%, rgba(20, 184, 166, 0.01) 100%); }

        .command-card:hover {
            transform: translateY(-5px);
            border-color: rgba(59, 130, 246, 0.3);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), 0 0 20px rgba(59, 130, 246, 0.05);
        }

        .command-card.cyan-card:hover { border-color: rgba(6, 182, 212, 0.3); box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), 0 0 20px rgba(6, 182, 212, 0.05); }
        .command-card.purple-card:hover { border-color: rgba(139, 92, 246, 0.3); box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), 0 0 20px rgba(139, 92, 246, 0.05); }
        .command-card.amber-card:hover { border-color: rgba(245, 158, 11, 0.3); box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), 0 0 20px rgba(245, 158, 11, 0.05); }
        .command-card.pink-card:hover { border-color: rgba(236, 72, 153, 0.3); box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), 0 0 20px rgba(236, 72, 153, 0.05); }
        .command-card.emerald-card:hover { border-color: rgba(16, 185, 129, 0.3); box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), 0 0 20px rgba(16, 185, 129, 0.05); }
        .command-card.indigo-card:hover { border-color: rgba(99, 102, 241, 0.3); box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), 0 0 20px rgba(99, 102, 241, 0.05); }
        .command-card.teal-card:hover { border-color: rgba(20, 184, 166, 0.3); box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), 0 0 20px rgba(20, 184, 166, 0.05); }

        .command-card:hover::before { opacity: 1; }

        .cmd-name {
            font-family: var(--font-title);
            font-size: 1.25rem;
            font-weight: 600;
            color: #60a5fa;
            z-index: 1;
        }

        .command-card.cyan-card .cmd-name { color: #22d3ee; }
        .command-card.purple-card .cmd-name { color: #a78bfa; }
        .command-card.amber-card .cmd-name { color: #fbbf24; }
        .command-card.pink-card .cmd-name { color: #f472b6; }
        .command-card.emerald-card .cmd-name { color: #34d399; }
        .command-card.indigo-card .cmd-name { color: #818cf8; }
        .command-card.teal-card .cmd-name { color: #2dd4bf; }

        .cmd-desc {
            font-size: 0.88rem;
            color: var(--text-secondary);
            line-height: 1.5;
            margin: 0.75rem 0;
            flex-grow: 1;
            z-index: 1;
        }

        .cmd-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 0.5rem;
            z-index: 1;
        }

        .cmd-tag {
            font-size: 0.72rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 600;
            padding: 0.25rem 0.5rem;
            border-radius: 6px;
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-secondary);
        }

        .cmd-tag.gated {
            background: rgba(245, 158, 11, 0.15);
            color: #fbbf24;
            border: 1px solid rgba(245, 158, 11, 0.2);
        }

        .cmd-link {
            font-size: 0.8rem;
            color: var(--text-secondary);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 0.25rem;
            transition: color 0.2s ease;
        }

        .cmd-link:hover { color: var(--text-primary); }

        /* Agent Cards */
        .agent-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 1.5rem;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 220px;
        }

        .agent-card::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .agent-card.cyan-card::before { background: linear-gradient(135deg, rgba(6, 182, 212, 0.08) 0%, rgba(6, 182, 212, 0.01) 100%); }
        .agent-card.purple-card::before { background: linear-gradient(135deg, rgba(139, 92, 246, 0.08) 0%, rgba(139, 92, 246, 0.01) 100%); }
        .agent-card.amber-card::before { background: linear-gradient(135deg, rgba(245, 158, 11, 0.08) 0%, rgba(245, 158, 11, 0.01) 100%); }
        .agent-card.pink-card::before { background: linear-gradient(135deg, rgba(236, 72, 153, 0.08) 0%, rgba(236, 72, 153, 0.01) 100%); }
        .agent-card.emerald-card::before { background: linear-gradient(135deg, rgba(16, 185, 129, 0.08) 0%, rgba(16, 185, 129, 0.01) 100%); }
        .agent-card.indigo-card::before { background: linear-gradient(135deg, rgba(99, 102, 241, 0.08) 0%, rgba(99, 102, 241, 0.01) 100%); }
        .agent-card.teal-card::before { background: linear-gradient(135deg, rgba(20, 184, 166, 0.08) 0%, rgba(20, 184, 166, 0.01) 100%); }

        .agent-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .agent-card.cyan-card:hover { border-color: rgba(6, 182, 212, 0.3); box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), 0 0 20px rgba(6, 182, 212, 0.08); }
        .agent-card.purple-card:hover { border-color: rgba(139, 92, 246, 0.3); box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), 0 0 20px rgba(139, 92, 246, 0.08); }
        .agent-card.amber-card:hover { border-color: rgba(245, 158, 11, 0.3); box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), 0 0 20px rgba(245, 158, 11, 0.08); }
        .agent-card.pink-card:hover { border-color: rgba(236, 72, 153, 0.3); box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), 0 0 20px rgba(236, 72, 153, 0.08); }
        .agent-card.emerald-card:hover { border-color: rgba(16, 185, 129, 0.3); box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), 0 0 20px rgba(16, 185, 129, 0.08); }
        .agent-card.indigo-card:hover { border-color: rgba(99, 102, 241, 0.3); box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), 0 0 20px rgba(99, 102, 241, 0.08); }
        .agent-card.teal-card:hover { border-color: rgba(20, 184, 166, 0.3); box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), 0 0 20px rgba(20, 184, 166, 0.08); }

        .agent-card:hover::before { opacity: 1; }

        .agent-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.5rem;
            z-index: 1;
        }

        .agent-handle {
            font-family: var(--font-title);
            font-size: 1.3rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            z-index: 1;
        }

        .agent-card.cyan-card .agent-handle { color: #22d3ee; }
        .agent-card.purple-card .agent-handle { color: #c084fc; }
        .agent-card.amber-card .agent-handle { color: #fbbf24; }
        .agent-card.pink-card .agent-handle { color: #f472b6; }
        .agent-card.emerald-card .agent-handle { color: #34d399; }
        .agent-card.indigo-card .agent-handle { color: #818cf8; }
        .agent-card.teal-card .agent-handle { color: #2dd4bf; }

        .agent-desc {
            font-size: 0.88rem;
            color: var(--text-secondary);
            line-height: 1.5;
            margin: 0.5rem 0 0.75rem 0;
            flex-grow: 1;
            z-index: 1;
        }

        .agent-skills-list {
            display: flex;
            flex-wrap: wrap;
            gap: 0.35rem;
            margin-top: 0.5rem;
            margin-bottom: 1rem;
            z-index: 1;
        }

        .agent-skill-badge {
            font-size: 0.72rem;
            font-family: var(--font-code);
            padding: 0.2rem 0.5rem;
            border-radius: 6px;
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-secondary);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .write-tools-badge {
            font-size: 0.72rem;
            font-weight: 600;
            padding: 0.2rem 0.6rem;
            border-radius: 50px;
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            z-index: 1;
        }

        .write-tools-badge.enabled {
            background: rgba(16, 185, 129, 0.15);
            color: #34d399;
            border: 1px solid rgba(16, 185, 129, 0.3);
        }

        .write-tools-badge.disabled {
            background: rgba(148, 163, 184, 0.1);
            color: #94a3b8;
            border: 1px solid rgba(148, 163, 184, 0.2);
        }

        /* Workflow & Skills Map Styles */
        .skills-map-container {
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
            width: 100%;
            grid-column: 1 / -1;
        }

        .phase-pipeline {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            position: relative;
        }

        .phase-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 1.25rem 1.5rem;
            position: relative;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .phase-card:hover {
            transform: translateX(6px);
            border-color: rgba(245, 158, 11, 0.4);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4), 0 0 20px rgba(245, 158, 11, 0.1);
        }

        .phase-card.cyan-card:hover { border-color: rgba(6, 182, 212, 0.4); box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4), 0 0 20px rgba(6, 182, 212, 0.1); }
        .phase-card.pink-card:hover { border-color: rgba(236, 72, 153, 0.4); box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4), 0 0 20px rgba(236, 72, 153, 0.1); }
        .phase-card.indigo-card:hover { border-color: rgba(99, 102, 241, 0.4); box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4), 0 0 20px rgba(99, 102, 241, 0.1); }
        .phase-card.teal-card:hover { border-color: rgba(20, 184, 166, 0.4); box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4), 0 0 20px rgba(20, 184, 166, 0.1); }
        .phase-card.emerald-card:hover { border-color: rgba(16, 185, 129, 0.4); box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4), 0 0 20px rgba(16, 185, 129, 0.1); }

                );

                if (filteredAgents.length === 0) {
                    container.innerHTML = `<div style="grid-column: 1/-1; text-align: center; color: var(--text-secondary); padding: 3rem;">No matching subagents found.</div>`;
                    return;
                }

                filteredAgents.forEach(agent => {
                    const card = document.createElement("div");
                    card.className = `agent-card ${agent.theme}-card`;
                    card.innerHTML = `
                        <div class="agent-header">
                            <div class="agent-handle">${agent.handle}</div>
                            <span class="write-tools-badge ${agent.writeTools ? "enabled" : "disabled"}">
                                ${agent.writeTools ? "Write Tools: Enabled" : "Read-Only"}
                            </span>
                        </div>
                        <div class="agent-desc">${agent.desc}</div>
                        <div class="agent-skills-list">
                            ${agent.skills.map(s => `<span class="agent-skill-badge">${s}</span>`).join('')}
                        </div>
                        <div class="cmd-footer">
                            <span class="cmd-tag">Subagent Manifest</span>
                            <a href="${agent.path}" class="cmd-link" target="_blank">
                                <span>agent.json</span>
                                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>
                            </a>
                        </div>
                    `;
                    container.appendChild(card);
                });
                return;
            }

            const filtered = data.commands.filter(cmd =>
                cmd.name.toLowerCase().includes(filterText.toLowerCase()) ||
                cmd.desc.toLowerCase().includes(filterText.toLowerCase())
            );

            if (filtered.length === 0) {
                container.innerHTML = `<div style="grid-column: 1/-1; text-align: center; color: var(--text-secondary); padding: 3rem;">No matching commands found.</div>`;
                return;
            }

            filtered.forEach(cmd => {
                const card = document.createElement("div");
                const cardTheme = cmd.theme || themeClass;
                card.className = `command-card ${cardTheme}-card`;
                card.innerHTML = `
                    <div class="cmd-name">${cmd.name}</div>
                    <div class="cmd-desc">${cmd.desc}</div>
                    <div class="cmd-footer">
                        <span class="cmd-tag ${cmd.gated ? "gated" : ""}">${cmd.gated ? "Gated Confirmation" : "Direct Action"}</span>
                        <a href="${cmd.path}" class="cmd-link" target="_blank">
                            <span>Workflow</span>
                            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>
                        </a>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function renderGraphFlowView(container, filterText = "") {
            const searchLower = filterText.toLowerCase();
            const filteredPhases = sddWorkflowPhases.filter(p =>
                p.phase.toLowerCase().includes(searchLower) ||
                p.name.toLowerCase().includes(searchLower) ||
                p.desc.toLowerCase().includes(searchLower) ||
                (p.agents ? p.agents.join(' ') : '').toLowerCase().includes(searchLower) ||
                p.skills.some(s => s.name.toLowerCase().includes(searchLower) || s.label.toLowerCase().includes(searchLower))
            );

            if (filteredPhases.length === 0) {
                container.innerHTML = `<div style="grid-column: 1/-1; text-align: center; color: var(--text-secondary); padding: 3rem;">No matching workflow phases found.</div>`;
                return;
            }

            const layout = document.createElement("div");
            layout.className = "graph-flow-layout";

            // Left Column: DAG Pipeline
            const pipelineCol = document.createElement("div");
            pipelineCol.className = "dag-pipeline-column";

            // Switch to Map View Banner
            const switchBanner = document.createElement("div");
            switchBanner.className = "flow-switch-banner";
            switchBanner.innerHTML = `
                <div style="display: flex; align-items: center; gap: 0.5rem;">
                    <span style="font-size: 1.1rem;">📋</span>
                    <span>Prefer a sequential listing? Switch to <strong>Linear Phase Map View</strong></span>
                </div>
                <span style="color: #60a5fa; font-weight: 600;">View Linear Map →</span>
            `;
            switchBanner.addEventListener("click", () => loadPluginByName("skills-map"));
            pipelineCol.appendChild(switchBanner);

            // Phase cards rendering
            const p0 = sddWorkflowPhases.find(p => p.phase === "P0");
            if (p0 && (!searchLower || filteredPhases.includes(p0))) {
                pipelineCol.appendChild(createDagPhaseCard(p0, 0));
                pipelineCol.appendChild(createDagConnector("▼ Ingestion & Manifest Survey"));
            }

            const p1 = sddWorkflowPhases.find(p => p.phase === "P1");
            if (p1 && (!searchLower || filteredPhases.includes(p1))) {
                pipelineCol.appendChild(createDagPhaseCard(p1, 1));
                pipelineCol.appendChild(createDagConnector("▼ Validated Specs & Grill (GO/NO-GO)"));
            }

            const p2 = sddWorkflowPhases.find(p => p.phase === "P2");
            if (p2 && (!searchLower || filteredPhases.includes(p2))) {
                pipelineCol.appendChild(createDagPhaseCard(p2, 2));
                pipelineCol.appendChild(createDagConnector("▼ Approved Architecture & UI Screens"));
            }

            const p3 = sddWorkflowPhases.find(p => p.phase === "P3");
            if (p3 && (!searchLower || filteredPhases.includes(p3))) {
                pipelineCol.appendChild(createDagPhaseCard(p3, 3));
                pipelineCol.appendChild(createDagConnector("▼ Topological Dependency DAG (Tier 0 ➔ Tier 3)"));
            }

            // P4 & P5 Loop Container
            const p4 = sddWorkflowPhases.find(p => p.phase === "P4");
            const p5 = sddWorkflowPhases.find(p => p.phase === "P5");
            if ((p4 && (!searchLower || filteredPhases.includes(p4))) || (p5 && (!searchLower || filteredPhases.includes(p5)))) {
                const loopBox = document.createElement("div");
                loopBox.className = "dag-loop-box";
                loopBox.innerHTML = `
                    <div class="dag-box-header">
                        <span style="color: #f59e0b; display: flex; align-items: center; gap: 0.4rem;">
                            <span style="width: 8px; height: 8px; border-radius: 50%; background: #f59e0b; display: inline-block;"></span>
                            Autonomous Repair Engine (P4 ↔ P5 Closed Loop ≤3x)
                        </span>
                        <span style="color: var(--text-secondary); font-size: 0.72rem; font-family: var(--font-code);">Topological Execution</span>
                    </div>
                `;
                if (p4) loopBox.appendChild(createDagPhaseCard(p4, 4));
                const loopConn = document.createElement("div");
                loopConn.className = "dag-connector";
                loopConn.style.color = "#f59e0b";
                loopConn.style.fontWeight = "500";
                loopConn.innerHTML = `
                    <span>▼ Builds Code Along DAG Tiers</span>
                    <span style="opacity: 0.3;">|</span>
                    <span>▲ AST Diagnostic Repair Traces (≤3x)</span>
                `;
                loopBox.appendChild(loopConn);
                if (p5) loopBox.appendChild(createDagPhaseCard(p5, 5));
                pipelineCol.appendChild(loopBox);
                pipelineCol.appendChild(createDagConnector("▼ Graph Health: OK & Test Suites Pass"));
            }

            const p6 = sddWorkflowPhases.find(p => p.phase === "P6");
            if (p6 && (!searchLower || filteredPhases.includes(p6))) {
                pipelineCol.appendChild(createDagPhaseCard(p6, 6));
                pipelineCol.appendChild(createDagConnector("▼ Pull Request Approved"));
            }

            const p7 = sddWorkflowPhases.find(p => p.phase === "P7");
            if (p7 && (!searchLower || filteredPhases.includes(p7))) {
                pipelineCol.appendChild(createDagPhaseCard(p7, 7));
                pipelineCol.appendChild(createDagConnector("▼ Memory Promoted & Code Consolidated"));
            }

            // Governance Box: P8 & P9
            const p8 = sddWorkflowPhases.find(p => p.phase === "P8");
            const p9 = sddWorkflowPhases.find(p => p.phase === "P9");
            if ((p8 && (!searchLower || filteredPhases.includes(p8))) || (p9 && (!searchLower || filteredPhases.includes(p9)))) {
                const govBox = document.createElement("div");
                govBox.className = "dag-governance-box";
                govBox.innerHTML = `
                    <div class="dag-box-header">
                        <span style="color: #f43f5e; display: flex; align-items: center; gap: 0.4rem;">
                            <span style="width: 8px; height: 8px; border-radius: 50%; background: #f43f5e; display: inline-block;"></span>
                            Level 2: Human Governance & Release Gates
                        </span>
                        <span style="color: #f43f5e; font-size: 0.72rem; font-family: var(--font-code);">Strict Confirmation Required</span>
                    </div>
                `;
                if (p8) govBox.appendChild(createDagPhaseCard(p8, 8));
                const govConn = document.createElement("div");
                govConn.className = "dag-connector";
                govConn.style.color = "#f43f5e";
                govConn.style.fontWeight = "500";
                govConn.innerHTML = `<span>▼ Human Sign-off Received & Verified</span>`;
                govBox.appendChild(govConn);
                if (p9) govBox.appendChild(createDagPhaseCard(p9, 9));
                pipelineCol.appendChild(govBox);
            }

            layout.appendChild(pipelineCol);

            // Right Column: Sticky Inspector
            const inspectorCol = document.createElement("div");
            inspectorCol.id = "dag-inspector-col";
            inspectorCol.className = "dag-inspector-column";
            inspectorCol.innerHTML = renderDagInspectorHtml(sddWorkflowPhases[selectedDagPhaseIdx] || sddWorkflowPhases[0]);
            layout.appendChild(inspectorCol);

            container.appendChild(layout);
        }

        function createDagPhaseCard(phase, idx) {
            const card = document.createElement("div");
            card.id = `dag-card-${idx}`;
            card.className = `dag-card ${phase.theme}-card ${idx === selectedDagPhaseIdx ? "selected" : ""}`;
            card.innerHTML = `
                <div style="display: flex; justify-content: space-between; align-items: center; gap: 0.5rem;">
                    <div style="display: flex; align-items: center; gap: 0.6rem;">
                        <span class="phase-badge ${phase.theme}">${phase.phase}</span>
                        <span style="font-family: var(--font-title); font-size: 1.05rem; font-weight: 700; color: var(--text-primary);">${phase.name}</span>
                    </div>
                    <div style="display: flex; align-items: center; gap: 0.35rem;">
                        ${phase.loopTag ? `<span style="font-size: 0.7rem; font-family: var(--font-code); padding: 0.2rem 0.5rem; border-radius: 50px; background: rgba(59, 130, 246, 0.15); color: #60a5fa; border: 1px solid rgba(59, 130, 246, 0.3);">${phase.loopTag}</span>` : ""}
                        ${phase.dagTier ? `<span style="font-size: 0.7rem; font-family: var(--font-code); padding: 0.2rem 0.5rem; border-radius: 50px; background: rgba(139, 92, 246, 0.15); color: #c084fc; border: 1px solid rgba(139, 92, 246, 0.3);">${phase.dagTier}</span>` : ""}
                    </div>
                </div>
                <div style="font-size: 0.85rem; color: var(--text-secondary); line-height: 1.45;">${phase.desc}</div>
                <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 0.3rem;">
                    <div style="display: flex; flex-wrap: wrap; gap: 0.3rem;">
                        ${(phase.agents || []).map(a => `<span class="phase-agent-tag" style="font-size: 0.72rem; padding: 0.15rem 0.5rem;">${a}</span>`).join('')}
                    </div>
                    <span style="font-size: 0.72rem; color: var(--text-secondary); font-family: var(--font-code); opacity: 0.8;">Click to inspect →</span>
                </div>
            `;
            card.addEventListener("click", () => {
                selectedDagPhaseIdx = idx;
                document.querySelectorAll(".dag-card").forEach(c => c.classList.remove("selected"));
                card.classList.add("selected");
                const inspectorCol = document.getElementById("dag-inspector-col");
                if (inspectorCol) {
                    inspectorCol.innerHTML = renderDagInspectorHtml(phase);
                }
            });
            return card;
        }

        function createDagConnector(text) {
            const conn = document.createElement("div");
            conn.className = "dag-connector";
            conn.innerHTML = `<span>${text}</span>`;
            return conn;
        }

        function renderDagInspectorHtml(phase) {
            const safetyColors = {
                emerald: "background: rgba(16, 185, 129, 0.12); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.25);",
                blue: "background: rgba(59, 130, 246, 0.12); color: #60a5fa; border: 1px solid rgba(59, 130, 246, 0.25);",
                purple: "background: rgba(139, 92, 246, 0.12); color: #c084fc; border: 1px solid rgba(139, 92, 246, 0.25);",
                amber: "background: rgba(245, 158, 11, 0.12); color: #fbbf24; border: 1px solid rgba(245, 158, 11, 0.25);",
                rose: "background: rgba(244, 63, 94, 0.12); color: #fb7185; border: 1px solid rgba(244, 63, 94, 0.25);"
            };
            const sStyle = safetyColors[phase.safetyTheme || "emerald"];

            return `
                <div class="dag-inspector-panel">
                    <div>
                        <span class="phase-badge ${phase.theme}">${phase.phase}</span>
                        <h3 style="font-family: var(--font-title); font-size: 1.2rem; font-weight: 700; margin-top: 0.5rem; color: var(--text-primary);">${phase.name}</h3>
                        <p style="font-size: 0.85rem; color: var(--text-secondary); margin-top: 0.4rem; line-height: 1.45;">${phase.desc}</p>
                    </div>

                    <div>
                        <span style="font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-secondary); font-weight: 600; display: block; margin-bottom: 0.4rem;">Assigned Subagents</span>
                        <div style="display: flex; flex-wrap: wrap; gap: 0.35rem;">
                            ${(phase.agents || []).map(a => `<span class="phase-agent-tag" style="font-size: 0.78rem;">${a}</span>`).join('')}
                        </div>
                    </div>

                    <div>
                        <span style="font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-secondary); font-weight: 600; display: block; margin-bottom: 0.4rem;">Skills & Tool Invocations</span>
                        <div style="display: flex; flex-direction: column; gap: 0.35rem;">
                            ${(phase.skills || []).map(s => `
                                <a href="${s.path}" target="_blank" class="skill-flow-node" style="font-size: 0.78rem; padding: 0.35rem 0.65rem;">
                                    <span>${s.name}</span>
                                    <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-left: auto;"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>
                                </a>
                            `).join('')}
                        </div>
                    </div>

                    <div>
                        <span style="font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-secondary); font-weight: 600; display: block; margin-bottom: 0.4rem;">Artifacts & Deliverables</span>
                        <ul style="list-style: disc; list-style-position: inside; font-size: 0.8rem; color: var(--text-secondary); font-family: var(--font-code); display: flex; flex-direction: column; gap: 0.25rem;">
                            ${(phase.artifacts || ["Feature diffs"]).map(art => `<li>${art}</li>`).join('')}
                        </ul>
                    </div>

                    <div>
                        <span style="font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-secondary); font-weight: 600; display: block; margin-bottom: 0.4rem;">Safety & Governance Gate</span>
                        <div style="padding: 0.75rem; border-radius: 12px; font-size: 0.8rem; line-height: 1.4; ${sStyle}">
                            ${phase.safety || "Read-only survey; zero destructive actions."}
                        </div>
                    </div>

                    <div style="border-top: 1px solid var(--glass-border); padding-top: 1rem;">
                        <span style="font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-secondary); font-weight: 600; display: block; margin-bottom: 0.5rem;">P3 Topological DAG Tiers</span>
                        <div style="display: flex; flex-direction: column; gap: 0.35rem;">
                            <div class="dag-tier-item"><span class="dag-tier-pill" style="background: rgba(139, 92, 246, 0.2); color: #c084fc;">Tier 0</span> <span>Foundation, Schema & Types</span></div>
                            <div class="dag-tier-item"><span class="dag-tier-pill" style="background: rgba(59, 130, 246, 0.2); color: #60a5fa;">Tier 1</span> <span>Domain Entities & Core Services</span></div>
                            <div class="dag-tier-item"><span class="dag-tier-pill" style="background: rgba(16, 185, 129, 0.2); color: #34d399;">Tier 2</span> <span>API Endpoints & UI Components</span></div>
                            <div class="dag-tier-item"><span class="dag-tier-pill" style="background: rgba(245, 158, 11, 0.2); color: #fbbf24;">Tier 3</span> <span>End-to-End Tests & Docs</span></div>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderPluginNavigation() {
            selectionList.innerHTML = "";
            Object.keys(pluginsData).forEach(key => {
                const data = pluginsData[key];
                const btn = document.createElement("button");
                btn.setAttribute("data-key", key);
                btn.className = `plugin-nav-btn ${key === activePluginKey ? "active" : ""} ${data.theme}-theme`;
                const count = data.isMapView ? sddWorkflowPhases.length : (data.isGraphFlowView ? "DAG" : (data.isAgentsView ? agentsData.length : data.commands.length));
                btn.innerHTML = `
                    <span>${data.displayName}</span>
                    <span class="badge">${count}</span>
                `;
                btn.addEventListener("click", () => {
                    document.querySelectorAll(".plugin-nav-btn").forEach(b => b.classList.remove("active"));
                    btn.classList.add("active");
                    loadPlugin(key);
                });
                selectionList.appendChild(btn);
            });

            if (agentSelectionList) {
                agentSelectionList.innerHTML = "";
                agentsData.forEach(agent => {
                    const btn = document.createElement("button");
                    btn.className = `plugin-nav-btn ${activePluginKey === "agents" ? "active" : ""} ${agent.theme}-theme`;
                    btn.innerHTML = `
                        <span>${agent.handle}</span>
                        <span class="badge" style="font-size: 0.65rem;">${agent.skills.length} skills</span>
                    `;
                    btn.addEventListener("click", () => {
                        document.querySelectorAll(".plugin-nav-btn").forEach(b => b.classList.remove("active"));
                        btn.classList.add("active");
                        loadPlugin("agents");
                        searchInput.value = agent.handle;
                        renderCommands(agent.handle);
                    });
                    agentSelectionList.appendChild(btn);
                });
            }
        }

        searchInput.addEventListener("input", (e) => {
            renderCommands(e.target.value);
        });

        // Initialize dashboard
        renderPluginNavigation();
        loadPlugin(activePluginKey);
    </script>
</body>
</html>
